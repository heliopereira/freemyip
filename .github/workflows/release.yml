name: Release Version

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: main

      - name: Calculate next semantic version tag
        id: version
        run: |
          git fetch --tags
          latest_tag=$(git tag --list --sort=-version:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          if [[ -z "$latest_tag" ]]; then
            next_tag="1.0.0"
          else
            IFS='.' read -r major minor patch <<< "$latest_tag"
            next_tag="$major.$minor.$((patch + 1))"
          fi
          echo "latest_tag=${latest_tag:-none}" >> $GITHUB_OUTPUT
          echo "next_tag=$next_tag" >> $GITHUB_OUTPUT
          echo "Release tag: $next_tag"

      - name: ZIP Component Dir
        run: |
          cd ${{ github.workspace }}/custom_components/freemyip
          zip -r freemyip.zip ./

      - name: Create Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ steps.version.outputs.next_tag }}
          name: v${{ steps.version.outputs.next_tag }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true

      - name: Upload zip to release
        uses: svenstaro/upload-release-action@6b7fa9f267e90b50a19fef07b3596790bb941741 # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ github.workspace }}/custom_components/freemyip/freemyip.zip
          asset_name: freemyip.zip
          tag: ${{ steps.version.outputs.next_tag }}
          overwrite: true
